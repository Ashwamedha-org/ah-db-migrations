<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#111b2e"/>
    </linearGradient>
    <filter id="glow4"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <g id="db">
      <ellipse cx="0" cy="-22" rx="34" ry="10"/>
      <path d="M-34 -22 L-34 22 A34 10 0 0 0 34 22 L34 -22" fill-opacity="0.9"/>
      <ellipse cx="0" cy="-22" rx="34" ry="10" fill-opacity="1"/>
    </g>
  </defs>
  <rect width="1000" height="540" rx="18" fill="url(#bg4)"/>
  <text x="40" y="52" fill="#e2e8f0" font-size="26" font-weight="700">ah-db-migrations — Sharded Primaries + Replica Fan-out</text>
  <text x="40" y="82" fill="#7c8aa5" font-size="16">Flyway/Liquibase schema applied identically to every shard; each primary streams to its replicas.</text>

  <!-- migration runner -->
  <rect x="400" y="110" width="200" height="54" rx="12" fill="#1e293b" stroke="#38bdf8"/>
  <text x="500" y="135" fill="#38bdf8" font-size="15" font-weight="700" text-anchor="middle">Migration Runner</text>
  <text x="500" y="154" fill="#7c8aa5" font-size="12" text-anchor="middle">V1__init → V__add_rider_cols</text>

  <!-- SHARD 1 primary -->
  <g transform="translate(230,280)">
    <use href="#db" fill="#7f1d1d" stroke="#f87171" stroke-width="2"/>
    <text x="0" y="5" fill="#fecaca" font-size="13" text-anchor="middle">Shard 1</text>
    <text x="0" y="24" fill="#fca5a5" font-size="11" text-anchor="middle">Primary · NE</text>
  </g>
  <!-- SHARD 2 primary -->
  <g transform="translate(730,280)">
    <use href="#db" fill="#7f1d1d" stroke="#f87171" stroke-width="2"/>
    <text x="0" y="5" fill="#fecaca" font-size="13" text-anchor="middle">Shard 2</text>
    <text x="0" y="24" fill="#fca5a5" font-size="11" text-anchor="middle">Primary · MW/S</text>
  </g>

  <!-- migration arrows -->
  <path d="M440 164 L250 258" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6 6" fill="none">
    <animate attributeName="stroke-dashoffset" values="24;0" dur="0.6s" repeatCount="indefinite"/>
  </path>
  <path d="M560 164 L750 258" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6 6" fill="none">
    <animate attributeName="stroke-dashoffset" values="24;0" dur="0.6s" repeatCount="indefinite"/>
  </path>

  <!-- replicas for shard 1 -->
  <g transform="translate(120,440)"><use href="#db" fill="#14532d" stroke="#22c55e" stroke-width="2"/><text x="0" y="2" fill="#bbf7d0" font-size="11" text-anchor="middle">Replica</text><text x="0" y="18" fill="#86efac" font-size="10" text-anchor="middle">1a</text></g>
  <g transform="translate(240,440)"><use href="#db" fill="#14532d" stroke="#22c55e" stroke-width="2"/><text x="0" y="2" fill="#bbf7d0" font-size="11" text-anchor="middle">Replica</text><text x="0" y="18" fill="#86efac" font-size="10" text-anchor="middle">1b</text></g>
  <!-- replicas for shard 2 -->
  <g transform="translate(730,440)"><use href="#db" fill="#14532d" stroke="#22c55e" stroke-width="2"/><text x="0" y="2" fill="#bbf7d0" font-size="11" text-anchor="middle">Replica</text><text x="0" y="18" fill="#86efac" font-size="10" text-anchor="middle">2a</text></g>
  <g transform="translate(850,440)"><use href="#db" fill="#14532d" stroke="#22c55e" stroke-width="2"/><text x="0" y="2" fill="#bbf7d0" font-size="11" text-anchor="middle">Replica</text><text x="0" y="18" fill="#86efac" font-size="10" text-anchor="middle">2b</text></g>

  <!-- replication streams with moving WAL packets -->
  <path d="M225 305 L130 415" stroke="#22c55e" stroke-width="1.6" stroke-dasharray="5 6" fill="none"/>
  <path d="M235 305 L240 415" stroke="#22c55e" stroke-width="1.6" stroke-dasharray="5 6" fill="none"/>
  <path d="M735 305 L735 415" stroke="#22c55e" stroke-width="1.6" stroke-dasharray="5 6" fill="none"/>
  <path d="M745 305 L845 415" stroke="#22c55e" stroke-width="1.6" stroke-dasharray="5 6" fill="none"/>
  <circle r="5" fill="#4ade80" filter="url(#glow4)"><animate attributeName="cx" values="225;130" dur="1.5s" repeatCount="indefinite"/><animate attributeName="cy" values="305;415" dur="1.5s" repeatCount="indefinite"/></circle>
  <circle r="5" fill="#4ade80" filter="url(#glow4)"><animate attributeName="cx" values="235;240" dur="1.5s" repeatCount="indefinite"/><animate attributeName="cy" values="305;415" dur="1.5s" repeatCount="indefinite"/></circle>
  <circle r="5" fill="#4ade80" filter="url(#glow4)"><animate attributeName="cx" values="735;735" dur="1.5s" repeatCount="indefinite"/><animate attributeName="cy" values="305;415" dur="1.5s" repeatCount="indefinite"/></circle>
  <circle r="5" fill="#4ade80" filter="url(#glow4)"><animate attributeName="cx" values="745;845" dur="1.5s" repeatCount="indefinite"/><animate attributeName="cy" values="305;415" dur="1.5s" repeatCount="indefinite"/></circle>

  <text x="470" y="300" fill="#64748b" font-size="13">writes</text>
  <text x="470" y="400" fill="#64748b" font-size="13">async replication (WAL)</text>
  <text x="40" y="520" fill="#64748b" font-size="13">Tables sharded by Employer_Group_ID / State_Code · age-banded rate tables + policy/member/claim schemas.</text>
</svg>
